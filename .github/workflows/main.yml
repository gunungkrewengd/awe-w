name: Auto Create SSH Trial ID3

on:
  workflow_dispatch:

jobs:
  buat-akun:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode repositori
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instal Patchright & Chromium
        run: |
          pip install patchright
          patchright install chromium
          patchright install-deps chromium

      - name: Jalankan skrip buat trial
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" python buat_trial.py

      - name: Simpan screenshot hasil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-screenshot
          path: "*.png"
          retention-days: 3
